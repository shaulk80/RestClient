# Builds both packages from a version tag, merges their checksums, and creates a DRAFT GitHub release.
# A draft is not public: open it on the releases page, read it, and press Publish.
#
# To release: set <Version> in Directory.Build.props, add a section "## <version> ..." to RELEASE_NOTES.md, merge to main,
# then push the tag:  git tag v<version> && git push origin v<version>
#
# A manual run from a branch (Actions, Release, Run workflow) does everything except creating the release, and uploads the
# merged files as the "release-preview" artifact, so the steps can be checked without a tag.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build both packages
    uses: ./.github/workflows/ci.yml

  publish:
    name: Merge checksums and create the draft release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - name: Check out
        uses: actions/checkout@v7

      # Lands as dist/RestDraft-win-x64.zip, dist/RestDraft-linux-x64.tar.gz, dist/SHA256SUMS.txt (Windows only)
      # and dist/SHA256SUMS-linux-x64.txt.
      - name: Download the packages
        uses: actions/download-artifact@v8
        with:
          pattern: RestDraft-*
          path: dist
          merge-multiple: true

      # One checksum file for the release, in the order build.ps1 writes it (sorted by file name), then checked.
      - name: Merge and verify the checksums
        working-directory: dist
        env:
          LC_ALL: C
        run: |
          cat SHA256SUMS.txt SHA256SUMS-linux-x64.txt | sort -k2 > SHA256SUMS.merged
          mv SHA256SUMS.merged SHA256SUMS.txt
          rm SHA256SUMS-linux-x64.txt
          cat SHA256SUMS.txt
          test "$(wc -l < SHA256SUMS.txt)" -eq 2
          sha256sum -c SHA256SUMS.txt

      - name: Read the version and the release notes
        id: notes
        run: |
          version="$(sed -n 's|.*<Version>\(.*\)</Version>.*|\1|p' Directory.Build.props)"
          awk -v v="$version" 'index($0, "## " v " ") == 1 { found = 1; next } /^## / { found = 0 } found' RELEASE_NOTES.md > notes.md
          test -n "$version"
          test -s notes.md || { echo "RELEASE_NOTES.md has no section for $version"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check that the tag matches the version
        if: env.IS_TAG == 'true'
        run: test "$GITHUB_REF_NAME" = "v${{ steps.notes.outputs.version }}"

      - name: Upload the merged files for inspection
        if: env.IS_TAG != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: release-preview
          path: |
            dist/
            notes.md
          retention-days: 3

      - name: Create the draft release
        if: env.IS_TAG == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          gh release create "$GITHUB_REF_NAME"
          dist/RestDraft-win-x64.zip dist/RestDraft-linux-x64.tar.gz dist/SHA256SUMS.txt
          --draft --verify-tag
          --title "RestDraft ${{ steps.notes.outputs.version }}"
          --notes-file notes.md
