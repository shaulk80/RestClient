# Windows and Linux jobs. Each runs scripts/build.ps1 on its own host and uploads its package from main.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows build, test and release zip
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # Restore, build with warnings as errors, test with coverage, publish win-x64, and smoke-test the zip.
      - name: Build, test and publish
        shell: pwsh
        run: ./scripts/build.ps1

      - name: Upload win-x64 release zip and checksums
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: RestDraft-win-x64
          path: |
            dist/RestDraft-win-x64.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  # Pinned to the Ubuntu version the Linux build was verified on (M9). ubuntu-latest moved to 26.04, which has no libicu74.
  linux:
    name: Linux build, test and release tarball
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # Xvfb is the virtual screen for the smoke test. The rest is the documented list of libraries the app needs on Linux.
      - name: Install virtual display and libraries
        run: >
          sudo apt-get update &&
          sudo apt-get install -y xvfb libicu74 libfontconfig1 fonts-dejavu-core libx11-6 libice6 libsm6 libxext6 libxrandr2
          libxi6 libxcursor1 libgl1

      # Restore, build with warnings as errors, test with coverage, publish linux-x64, package it as .tar.gz (keeps the
      # executable bit), then extract it and start it under Xvfb.
      - name: Build, test and publish
        shell: pwsh
        run: ./scripts/build.ps1 -Runtimes linux-x64

      # Two checksum files exist for one release (one per host). Keep them apart; merge them when the release is assembled.
      - name: Name the checksum file
        if: github.ref == 'refs/heads/main'
        run: mv dist/SHA256SUMS.txt dist/SHA256SUMS-linux-x64.txt

      - name: Upload linux-x64 release tarball and checksums
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: RestDraft-linux-x64
          path: |
            dist/RestDraft-linux-x64.tar.gz
            dist/SHA256SUMS-linux-x64.txt
          if-no-files-found: error
          retention-days: 14
